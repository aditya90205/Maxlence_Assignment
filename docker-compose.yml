version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: maxlence_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: maxlence_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: maxlence_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
